name: Shared Python-tests resources
description: Expose the script of Python tests from the running workflow revision.
outputs:
  path:
    description: Absolute path to the part folder of Python tests.
    value: ${{ steps.resources.outputs.path }}
runs:
  using: composite
  steps:
    - id: resources
      shell: bash
      env:
        RESOURCE_PATH: ${{ github.action_path }}
      run: printf 'path=%s\n' "$RESOURCE_PATH" >> "$GITHUB_OUTPUT"
