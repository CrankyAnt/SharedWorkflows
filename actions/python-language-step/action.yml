name: Shared Python language step
description: Run the shared Python checks with the pinned ruff, and mypy where the project configures it, on the job's own Python.
inputs:
  root:
    description: The directory, relative to the repository root, from which ruff and mypy run and in which the step looks for the mypy configuration.
    required: false
    default: "."
  format-check:
    description: Also run `ruff format --check`.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - id: cache-key
      shell: bash
      env:
        RESOURCE_PATH: ${{ github.action_path }}
        ROOT: ${{ inputs.root }}
        PYTHON: ${{ runner.os == 'Windows' && 'python' || 'python3' }}
      run: |
        set -euo pipefail
        key="$("$PYTHON" "$RESOURCE_PATH/python_language_step.py" --root "$ROOT" --print-cache-key "$RESOURCE_PATH/../repository-hygiene/pins.json")"
        printf 'key=%s\n' "$key" >> "$GITHUB_OUTPUT"
    - name: Restore cached Python language step tools
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/python-language-step-tools
        key: python-language-step-${{ runner.os }}-${{ steps.cache-key.outputs.key }}
    - shell: bash
      env:
        RESOURCE_PATH: ${{ github.action_path }}
        ROOT: ${{ inputs.root }}
        FORMAT_CHECK: ${{ inputs.format-check }}
        PYTHON: ${{ runner.os == 'Windows' && 'python' || 'python3' }}
        TOOLS: ${{ runner.temp }}/python-language-step-tools
      run: |
        set -euo pipefail
        options=()
        if [[ "$FORMAT_CHECK" == true ]]; then options+=(--format-check); fi
        "$PYTHON" "$RESOURCE_PATH/python_language_step.py" --root "$ROOT" --tools "$TOOLS" --install "$RESOURCE_PATH/../repository-hygiene/pins.json" "${options[@]}"
