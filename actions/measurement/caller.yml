name: Measurement

on:
  schedule:
    # Daily at 06:17 UTC.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  measurement:
    permissions:
      actions: read
      issues: write
    secrets:
      MEASUREMENT_APP_PRIVATE_KEY: ${{ secrets.MEASUREMENT_APP_PRIVATE_KEY }}
    uses: CrankyAnt/SharedWorkflows/.github/workflows/measurement.yml@v1
