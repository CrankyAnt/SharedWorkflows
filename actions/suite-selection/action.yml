name: Shared suite-selection resources
description: Expose the scripts of the suite selection from the running workflow revision.
outputs:
  path:
    description: Absolute path to the part folder of the suite selection.
    value: ${{ steps.resources.outputs.path }}
runs:
  using: composite
  steps:
    - id: resources
      shell: bash
      env:
        RESOURCE_PATH: ${{ github.action_path }}
      run: printf 'path=%s\n' "$RESOURCE_PATH" >> "$GITHUB_OUTPUT"
