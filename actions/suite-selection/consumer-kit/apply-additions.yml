name: Apply recorded additions

on:
  workflow_dispatch:
    inputs:
      run-id:
        description: The id of the validation run whose recording check reported additions
        required: true
        type: string
  workflow_run: # zizmor: ignore[dangerous-triggers] the job runs no pull-request code: it applies the run's additions with the recording step at v1 before any write token exists, and pushes only the suite list
    workflows: [Validation]
    types: [completed]

permissions: {}

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-slim
    permissions:
      actions: read
      contents: read
      pull-requests: read
    concurrency:
      group: ${{ github.workflow }}-${{ inputs.run-id || format('branch-{0}', github.event.workflow_run.head_branch) }}
      cancel-in-progress: false
    outputs:
      pull-request: ${{ steps.run.outputs.pull-request }}
      reason: ${{ steps.reason.outputs.reason }}
    env:
      RUN_ID: ${{ inputs.run-id || github.event.workflow_run.id }}
      PROPOSAL_BRANCH: chore/apply-recorded-additions-${{ inputs.run-id }}
      SUBJECT: "chore: apply the recorded additions of run ${{ inputs.run-id || github.event.workflow_run.id }}"
    steps:
      - id: run
        name: Find the run, its pull request and its additions artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! [[ "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::The run id must be a number: the id in the address of the validation run, .../actions/runs/<run id>."
            exit 1
          fi
          # One field per line, so that an empty field keeps its place.
          if ! fields="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.event, (.head_repository.full_name // ""), .head_branch, .head_sha, (.pull_requests[0].number // ""), ((.head_commit.message // "") | split("\n")[0])')"; then
            echo "::error::Run $RUN_ID of $GITHUB_REPOSITORY could not be read; start the workflow with the id of a run of this repository."
            exit 1
          fi
          mapfile -t field <<<"$fields"
          event="${field[0]:-}" head_repository="${field[1]:-}" head_branch="${field[2]:-}" head_sha="${field[3]:-}" pull_request="${field[4]:-}" subject="${field[5]:-}"
          if [ "$head_repository" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::Run $RUN_ID comes from a pull request whose head branch lies in the fork ${head_repository:-a deleted repository}; the App proposes only onto a branch of $GITHUB_REPOSITORY."
            exit 1
          fi
          # A run's pull_requests lists a pull request only while its head is the run's; the run's branch is what counts.
          if [ "$event" != pull_request ]; then
            echo "::error::Run $RUN_ID ran on the event $event and belongs to no pull request; the workflow proposes additions only onto the branch of the pull request that reported them."
            exit 1
          fi
          artifacts="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[] | select((.name | startswith("recording-additions-")) and (.expired | not)) | .name')"
          if [ -z "$artifacts" ] && [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            echo "Run $RUN_ID uploaded no recording-additions-* artifact: its recording checks reported no additions; nothing to apply." >> "$GITHUB_STEP_SUMMARY"
            echo "apply=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$artifacts" ]; then
            echo "::error::Run $RUN_ID has no recording-additions-* artifact: its recording checks reported no additions, or the artifacts expired; a new run of the pull request uploads them again."
            exit 1
          fi
          ref="$head_branch"
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::The run's head $head_sha is no commit id."; exit 1; }
            ref="$head_sha"
            # The pull request whose head is still the run's; a moved head or a closed pull request ends the workflow quietly.
            pull_request="$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" -f state=open -f "head=$GITHUB_REPOSITORY_OWNER:$head_branch" \
              --jq "[.[] | select(.head.sha == \"$head_sha\")][0].number // empty")"
            if [ -z "$pull_request" ]; then
              echo "No open pull request has the head $head_sha of $head_branch: the branch moved since run $RUN_ID or its pull request closed; nothing to apply." >> "$GITHUB_STEP_SUMMARY"
              echo "apply=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "pull-request=$pull_request" >> "$GITHUB_OUTPUT"
            # At most one automatic round per push: a failed run on the App's own additions commit applies nothing.
            bound='^chore: apply the recorded additions of run [0-9]+$'
            if [[ "$subject" =~ $bound ]]; then
              echo "The head commit $head_sha of run $RUN_ID carries the subject \"$subject\" of applied additions; the workflow applies one round per push and comments on #$pull_request." >> "$GITHUB_STEP_SUMMARY"
              printf 'apply=false\nbound=true\n' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "Run $RUN_ID of the pull request ${pull_request:+#$pull_request }on $head_branch uploaded:"
          echo "$artifacts"
          {
            echo "apply=true"
            echo "ref=$ref"
            echo "head-branch=$head_branch"
            echo "head-sha=$head_sha"
            echo "pull-request=$pull_request"
          } >> "$GITHUB_OUTPUT"
      - id: checkout
        if: steps.run.outputs.apply == 'true'
        uses: actions/checkout@<pin>
        with:
          ref: ${{ steps.run.outputs.ref }}
          fetch-depth: 1
          persist-credentials: false
      - id: additions
        if: steps.run.outputs.apply == 'true'
        uses: actions/download-artifact@<pin>
        with:
          pattern: recording-additions-*
          path: ${{ runner.temp }}/additions
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}
      - id: recording
        if: steps.run.outputs.apply == 'true'
        uses: CrankyAnt/SharedWorkflows/actions/recording@v1
      - id: apply
        name: Apply every additions artifact of the run
        if: steps.run.outputs.apply == 'true'
        env:
          RECORDING: ${{ steps.recording.outputs.path }}
          PULL_REQUEST: ${{ steps.run.outputs.pull-request }}
          HEAD_BRANCH: ${{ steps.run.outputs.head-branch }}
          REPORT: ${{ runner.temp }}/apply-additions-report.md
        run: |
          set -euo pipefail
          shopt -s globstar
          printf 'The recorded additions of run %s/%s/actions/runs/%s, for the pull request %son %s.\n\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$RUN_ID" "${PULL_REQUEST:+#$PULL_REQUEST }" "$HEAD_BRANCH" > "$REPORT"
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/repo-pycache" python3 "$RECORDING/recording.py" apply --suites .github/suites.json --summary "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP"/additions/**/additions.json | sed 's/^/- /' >> "$REPORT"
      - id: changes
        name: Find whether the suite list changed
        if: steps.run.outputs.apply == 'true'
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
              echo "Applying the additions of run $RUN_ID changes nothing in the suite list; nothing is committed." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Applying the additions of run $RUN_ID changes nothing in the suite list; no pull request opens." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check the changed files
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git diff --name-only | while IFS= read -r path; do
            case "$path" in
              .github/suites.json) ;;
              *) echo "Unexpected changed file: $path" >&2; exit 1 ;;
            esac
          done
      - uses: actions/create-github-app-token@<pin>
        id: app-token
        if: steps.changes.outputs.changed == 'true'
        with:
          client-id: ${{ vars.PUBLICATION_CHECKS_APP_CLIENT_ID }}
          private-key: ${{ secrets.PUBLICATION_CHECKS_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Configure the GitHub App identity
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_LOGIN: ${{ steps.app-token.outputs.app-slug }}[bot]
        run: |
          set -euo pipefail
          app_id="$(gh api "users/$APP_LOGIN" --jq .id)"
          git config user.name "$APP_LOGIN"
          git config user.email "$app_id+$APP_LOGIN@users.noreply.github.com"
      - name: Commit the applied additions
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git add .github/suites.json
          git diff --cached --check
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            # Dependabot keeps rebasing its pull request over a commit whose message holds [dependabot skip].
            git commit -m "$SUBJECT" -m "[dependabot skip]"
          else
            git switch -c "$PROPOSAL_BRANCH"
            git commit -m "$SUBJECT"
          fi
      - id: hygiene
        if: steps.changes.outputs.changed == 'true'
        uses: CrankyAnt/SharedWorkflows/actions/repository-hygiene@v1
        with:
          include-node-version: "false"
      - name: Install the pinned Gitleaks
        if: steps.changes.outputs.changed == 'true'
        env:
          HYGIENE: ${{ steps.hygiene.outputs.path }}
        run: PYTHONPYCACHEPREFIX="$RUNNER_TEMP/repo-pycache" python3 "$HYGIENE/install_tools.py" --pins "$HYGIENE/pins.json" --platform linux-x64 --tool gitleaks --destination "$RUNNER_TEMP/hygiene-tools"
      - name: Scan the commit before pushing
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' fetch --prune origin
          "$RUNNER_TEMP/hygiene-tools/gitleaks" git <gitleaks-options> --log-opts="HEAD --not --remotes=origin" --redact --no-banner --no-color
      - name: Push the applied additions to the pull request's branch
        id: push-branch
        if: steps.changes.outputs.changed == 'true' && github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_BRANCH: ${{ steps.run.outputs.head-branch }}
          HEAD_SHA: ${{ steps.run.outputs.head-sha }}
        run: |
          set -euo pipefail
          open="$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" -f state=open -f "head=$GITHUB_REPOSITORY_OWNER:$HEAD_BRANCH" \
            --jq "[.[] | select(.head.sha == \"$HEAD_SHA\")][0].number // empty")"
          if [ -z "$open" ]; then
            echo "No open pull request has the head $HEAD_SHA of $HEAD_BRANCH any more; nothing is pushed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The lease on the run's head: a branch that moved since the run is not pushed to, and its own run decides.
          if ! git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push --force-with-lease="refs/heads/$HEAD_BRANCH:$HEAD_SHA" origin "HEAD:refs/heads/$HEAD_BRANCH"; then
            remote="$(git -c credential.helper= -c 'credential.helper=!gh auth git-credential' ls-remote origin "refs/heads/$HEAD_BRANCH" | cut -f1)"
            if [ "$remote" != "$HEAD_SHA" ]; then
              echo "The branch $HEAD_BRANCH moved from $HEAD_SHA to ${remote:-nothing}; nothing is pushed, and its own run decides." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            exit 1
          fi
          echo "Committed the applied additions of run $RUN_ID onto $HEAD_BRANCH as $(git rev-parse HEAD), for #$open." >> "$GITHUB_STEP_SUMMARY"
      - name: Push the proposal branch
        id: push
        if: steps.changes.outputs.changed == 'true' && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          branch="$PROPOSAL_BRANCH"
          if git -c credential.helper= -c 'credential.helper=!gh auth git-credential' ls-remote --exit-code --heads origin "refs/heads/$branch" > /dev/null; then
            git -c credential.helper= -c 'credential.helper=!gh auth git-credential' fetch --no-tags origin "refs/heads/$branch:refs/remotes/origin/$branch"
            remote_tip="$(git rev-parse --verify "refs/remotes/origin/$branch")"
          else
            remote_tip=""
          fi
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push --force-with-lease="refs/heads/$branch:$remote_tip" origin "HEAD:refs/heads/$branch"
      - name: Create or update the proposal pull request
        id: pull-request
        if: steps.changes.outputs.changed == 'true' && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_BRANCH: ${{ steps.run.outputs.head-branch }}
          REPORT: ${{ runner.temp }}/apply-additions-report.md
        run: |
          set -euo pipefail
          url="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$PROPOSAL_BRANCH" --base "$HEAD_BRANCH" --state open --json url --jq '.[0].url')"
          if [ -n "$url" ]; then
            gh pr edit "$url" --title "$SUBJECT" --body-file "$REPORT"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base "$HEAD_BRANCH" --head "$PROPOSAL_BRANCH" --title "$SUBJECT" --body-file "$REPORT"
          fi
          echo "Proposed the applied additions of run $RUN_ID onto $HEAD_BRANCH from $PROPOSAL_BRANCH." >> "$GITHUB_STEP_SUMMARY"
      - id: stopped
        name: Name the App setting this run would need
        if: ${{ failure() && (steps.app-token.outcome == 'failure' || steps.push-branch.outcome == 'failure' || steps.push.outcome == 'failure' || steps.pull-request.outcome == 'failure') }}
        run: |
          echo "::error::The updater App could not commit or propose the applied additions: it needs Contents and Pull requests read and write, the repository variable PUBLICATION_CHECKS_APP_CLIENT_ID and the repository secret PUBLICATION_CHECKS_APP_PRIVATE_KEY, and a rule of the target branch may refuse its push."
          exit 1
      - id: reason
        name: Name the reason for a comment on the pull request
        if: always() && github.event_name == 'workflow_run'
        env:
          BOUND: ${{ steps.run.outputs.bound }}
          APPLIED: ${{ steps.apply.outcome }}
          CHANGED: ${{ steps.changes.outputs.changed }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "$BOUND" = true ]; then
            reason=bound
          elif [ "$APPLIED" = success ] && [ "$JOB_STATUS" = failure ]; then
            reason=failed
          elif [ "$CHANGED" = false ]; then
            reason=unchanged
          else
            reason=""
          fi
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

  comment:
    needs: apply
    if: always() && needs.apply.outputs.reason != ''
    runs-on: ubuntu-slim
    permissions:
      pull-requests: write
    steps:
      - name: Comment on the pull request with the reason and the manual route
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ needs.apply.outputs.pull-request }}
          REASON: ${{ needs.apply.outputs.reason }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          [[ "$PULL_REQUEST" =~ ^[0-9]+$ ]] || { echo "::error::The pull request number $PULL_REQUEST is no number."; exit 1; }
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::The run id $RUN_ID is no number."; exit 1; }
          case "$REASON" in
            bound) why="the run's head commit already carries additions that the App applied, and the workflow applies one round per push." ;;
            unchanged) why="applying them leaves the suite list unchanged." ;;
            failed) why="a step after applying them failed; [the workflow run]($WORKFLOW_RUN_URL) names it." ;;
            *) echo "::error::Unknown reason $REASON."; exit 1 ;;
          esac
          body="$RUNNER_TEMP/apply-additions-comment.md"
          fence="$(printf '\140\140\140')"
          {
            printf 'The additions workflow did not commit the recorded additions of [run %s](%s) onto this branch: %s\n\n' "$RUN_ID" "$RUN_URL" "$why"
            printf 'Apply them by hand from the default branch:\n\n%ssh\ngh workflow run apply-additions.yml -f run-id=%s\n%s\n\n' "$fence" "$RUN_ID" "$fence"
            printf 'The workflow then opens a pull request onto this branch whose only change is the suite list; merge it once its checks pass.\n'
          } > "$body"
          gh pr comment "$PULL_REQUEST" --repo "$GITHUB_REPOSITORY" --body-file "$body"
