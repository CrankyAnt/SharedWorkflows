name: Apply recorded additions

on:
  workflow_dispatch:
    inputs:
      run-id:
        description: The id of the validation run whose recording check reported additions
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ inputs.run-id }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-slim
    permissions:
      actions: read
      contents: read
    env:
      RUN_ID: ${{ inputs.run-id }}
      PROPOSAL_BRANCH: chore/apply-recorded-additions-${{ inputs.run-id }}
      PROPOSAL_TITLE: "chore: apply the recorded additions of run ${{ inputs.run-id }}"
    steps:
      - id: run
        name: Find the run's pull request and its additions artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! [[ "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::The run id must be a number: the id in the address of the validation run, .../actions/runs/<run id>."
            exit 1
          fi
          # One field per line, so that an empty field keeps its place.
          if ! fields="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.event, (.head_repository.full_name // ""), .head_branch, (.pull_requests[0].number // "")')"; then
            echo "::error::Run $RUN_ID of $GITHUB_REPOSITORY could not be read; start the workflow with the id of a run of this repository."
            exit 1
          fi
          mapfile -t field <<<"$fields"
          event="${field[0]:-}" head_repository="${field[1]:-}" head_branch="${field[2]:-}" pull_request="${field[3]:-}"
          if [ "$head_repository" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::Run $RUN_ID comes from a pull request whose head branch lies in the fork ${head_repository:-a deleted repository}; the App proposes only onto a branch of $GITHUB_REPOSITORY."
            exit 1
          fi
          # A run's pull_requests lists a pull request only while its head is the run's; the run's branch is what counts.
          if [ "$event" != pull_request ]; then
            echo "::error::Run $RUN_ID ran on the event $event and belongs to no pull request; the workflow proposes additions only onto the branch of the pull request that reported them."
            exit 1
          fi
          artifacts="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[] | select((.name | startswith("recording-additions-")) and (.expired | not)) | .name')"
          if [ -z "$artifacts" ]; then
            echo "::error::Run $RUN_ID has no recording-additions-* artifact: its recording checks reported no additions, or the artifacts expired; a new run of the pull request uploads them again."
            exit 1
          fi
          echo "Run $RUN_ID of the pull request ${pull_request:+#$pull_request }on $head_branch uploaded:"
          echo "$artifacts"
          {
            echo "head-branch=$head_branch"
            echo "pull-request=$pull_request"
          } >> "$GITHUB_OUTPUT"
      - id: checkout
        uses: actions/checkout@<pin>
        with:
          ref: ${{ steps.run.outputs.head-branch }}
          fetch-depth: 1
          persist-credentials: false
      - id: additions
        uses: actions/download-artifact@<pin>
        with:
          pattern: recording-additions-*
          path: ${{ runner.temp }}/additions
          run-id: ${{ inputs.run-id }}
          github-token: ${{ github.token }}
      - id: recording
        uses: CrankyAnt/SharedWorkflows/actions/recording@v1
      - name: Apply every additions artifact of the run
        env:
          RECORDING: ${{ steps.recording.outputs.path }}
          PULL_REQUEST: ${{ steps.run.outputs.pull-request }}
          HEAD_BRANCH: ${{ steps.run.outputs.head-branch }}
          REPORT: ${{ runner.temp }}/apply-additions-report.md
        run: |
          set -euo pipefail
          printf 'The recorded additions of run %s/%s/actions/runs/%s, for the pull request %son %s.\n\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$RUN_ID" "${PULL_REQUEST:+#$PULL_REQUEST }" "$HEAD_BRANCH" > "$REPORT"
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/repo-pycache" python3 "$RECORDING/recording.py" apply --suites .github/suites.json --summary "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP"/additions/*/additions.json | sed 's/^/- /' >> "$REPORT"
      - id: changes
        name: Find whether the suite list changed
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Applying the additions of run $RUN_ID changes nothing in the suite list; no pull request opens." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check the changed files
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git diff --name-only | while IFS= read -r path; do
            case "$path" in
              .github/suites.json) ;;
              *) echo "Unexpected changed file: $path" >&2; exit 1 ;;
            esac
          done
      - uses: actions/create-github-app-token@<pin>
        id: app-token
        if: steps.changes.outputs.changed == 'true'
        with:
          client-id: ${{ vars.PUBLICATION_CHECKS_APP_CLIENT_ID }}
          private-key: ${{ secrets.PUBLICATION_CHECKS_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Configure the GitHub App identity
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_LOGIN: ${{ steps.app-token.outputs.app-slug }}[bot]
        run: |
          set -euo pipefail
          app_id="$(gh api "users/$APP_LOGIN" --jq .id)"
          git config user.name "$APP_LOGIN"
          git config user.email "$app_id+$APP_LOGIN@users.noreply.github.com"
      - name: Commit the applied additions
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git switch -c "$PROPOSAL_BRANCH"
          git add .github/suites.json
          git diff --cached --check
          git commit -m "$PROPOSAL_TITLE"
      - id: hygiene
        if: steps.changes.outputs.changed == 'true'
        uses: CrankyAnt/SharedWorkflows/actions/repository-hygiene@v1
        with:
          include-node-version: "false"
      - name: Install the pinned Gitleaks
        if: steps.changes.outputs.changed == 'true'
        env:
          HYGIENE: ${{ steps.hygiene.outputs.path }}
        run: PYTHONPYCACHEPREFIX="$RUNNER_TEMP/repo-pycache" python3 "$HYGIENE/install_tools.py" --pins "$HYGIENE/pins.json" --platform linux-x64 --tool gitleaks --destination "$RUNNER_TEMP/hygiene-tools"
      - name: Scan the commit before pushing
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' fetch --prune origin
          "$RUNNER_TEMP/hygiene-tools/gitleaks" git <gitleaks-options> --log-opts="HEAD --not --remotes=origin" --redact --no-banner --no-color
      - name: Push the proposal branch
        id: push
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          branch="$PROPOSAL_BRANCH"
          if git -c credential.helper= -c 'credential.helper=!gh auth git-credential' ls-remote --exit-code --heads origin "refs/heads/$branch" > /dev/null; then
            git -c credential.helper= -c 'credential.helper=!gh auth git-credential' fetch --no-tags origin "refs/heads/$branch:refs/remotes/origin/$branch"
            remote_tip="$(git rev-parse --verify "refs/remotes/origin/$branch")"
          else
            remote_tip=""
          fi
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push --force-with-lease="refs/heads/$branch:$remote_tip" origin "HEAD:refs/heads/$branch"
      - name: Create or update the proposal pull request
        id: pull-request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_BRANCH: ${{ steps.run.outputs.head-branch }}
          REPORT: ${{ runner.temp }}/apply-additions-report.md
        run: |
          set -euo pipefail
          url="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$PROPOSAL_BRANCH" --base "$HEAD_BRANCH" --state open --json url --jq '.[0].url')"
          if [ -n "$url" ]; then
            gh pr edit "$url" --title "$PROPOSAL_TITLE" --body-file "$REPORT"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base "$HEAD_BRANCH" --head "$PROPOSAL_BRANCH" --title "$PROPOSAL_TITLE" --body-file "$REPORT"
          fi
          echo "Proposed the applied additions of run $RUN_ID onto $HEAD_BRANCH from $PROPOSAL_BRANCH." >> "$GITHUB_STEP_SUMMARY"
      - id: stopped
        name: Name the App setting this run would need
        if: ${{ failure() && (steps.app-token.outcome == 'failure' || steps.push.outcome == 'failure' || steps.pull-request.outcome == 'failure') }}
        run: |
          echo "::error::The updater App could not propose the applied additions with its installation and credentials: it needs Contents and Pull requests read and write, the repository variable PUBLICATION_CHECKS_APP_CLIENT_ID and the repository secret PUBLICATION_CHECKS_APP_PRIVATE_KEY."
          exit 1
