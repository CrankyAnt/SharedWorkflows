name: <name>
on:
  workflow_call:
    inputs:
      shards:
        type: string
        required: false
      windows:
        type: string
        required: false
      language-steps:
        type: string
        required: false
      shared-digest:
        type: string
        required: true
permissions: {}
jobs:
  linux:
    if: inputs.shards != '' && inputs.shards != '[]'
    name: shard ${{ matrix.shard.shard }}
    runs-on: <linux-runner>
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.shards) }}
    env:
      SHARD: ${{ toJSON(matrix.shard) }}
    steps:
      - uses: actions/checkout@<pin>
        with:
          ref: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.sha || '' }}
          persist-credentials: false
      - id: recording
        uses: CrankyAnt/SharedWorkflows/actions/recording@v1
        with:
          digest: ${{ inputs.shared-digest }}
      - name: Set up Python outside the recording
        id: python
        if: contains(matrix.shard.setups, 'python')
        uses: actions/setup-python@<pin>
        with:
          python-version: "<python-version>"
          update-environment: false
      - name: Start the recording
        id: start
        env:
          RECORDING: ${{ steps.recording.outputs.path }}
        run: python3 "$RECORDING/recording.py" start
      - name: Provide the set-up Python with the lookup report to the entry files that state it
        if: contains(matrix.shard.setups, 'python')
        env:
          RECORDING: ${{ steps.recording.outputs.path }}
          PYTHON_PATH: ${{ steps.python.outputs.python-path }}
        run: python3 "$RECORDING/recording.py" provide --setup python --path "$(dirname "$PYTHON_PATH")" --python "$PYTHON_PATH"
      - name: Run the setup <setup> under the recording
        if: contains(matrix.shard.setups, '<setup>')
        env:
          RECORDING: ${{ steps.recording.outputs.path }}
        run: |
          python3 "$RECORDING/recording.py" exec --setup <setup> -- <setup-command>
          python3 "$RECORDING/recording.py" provide --setup <setup> <setup-provides>
      - name: Run the shard's entry files under the recording, two at a time
        env:
          RECORDING: ${{ steps.recording.outputs.path }}
        run: |
          set -uo pipefail
          export LOGS="$RUNNER_TEMP/entry-logs"
          mkdir -p "$LOGS"
          # Each entry file's log and status are named after its position in the shard, which no other entry file of the
          # shard shares, also when two paths flatten alike or one entry file runs for two suites.
          # shellcheck disable=SC2329 # xargs invokes run_entry through bash -c
          run_entry() {
            local index suite entry command
            index="$(jq -r .index <<<"$1")"
            suite="$(jq -r .suite <<<"$1")"
            entry="$(jq -r .entry <<<"$1")"
            mapfile -t command < <(jq -r '.command[]' <<<"$1")
            python3 "$RECORDING/recording.py" exec --entry "$entry" --suites .github/suites.json --suite "$suite" -- "${command[@]}" "$entry" > "$LOGS/$index.log" 2>&1
            echo "$?" > "$LOGS/$index.status"
            echo "$entry ($suite) exited with $(cat "$LOGS/$index.status")"
          }
          export -f run_entry
          # shellcheck disable=SC2016 # the inner script expands $1 itself
          jq -c '.entries | to_entries[] | .value + {index: .key}' <<<"$SHARD" | xargs -d '\n' -r -n 1 -P 2 bash -c 'run_entry "$1"' _
          failed=0
          while IFS=$'\t' read -r index suite entry; do
            echo "::group::$entry ($suite)"
            cat "$LOGS/$index.log"
            echo "::endgroup::"
            if [[ "$(cat "$LOGS/$index.status" 2>/dev/null)" != 0 ]]; then
              echo "::error::$entry ($suite) failed"
              failed=1
            fi
          done < <(jq -r '.entries | to_entries[] | [(.key | tostring), .value.suite, .value.entry] | @tsv' <<<"$SHARD")
          exit "$failed"
      - name: Check the recording against the suite list
        id: check
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        uses: CrankyAnt/SharedWorkflows/actions/recording@v1
        with:
          check: "true"
          suites: .github/suites.json
          artifact-name: recording-additions-shard-${{ matrix.shard.shard }}
      - name: Run the Python language step outside the recording
        if: ${{ !cancelled() && matrix.shard.shard == 1 && fromJSON(inputs.language-steps).python == 'run' }}
        uses: CrankyAnt/SharedWorkflows/actions/python-language-step@v1
      - name: List the entry files that passed
        if: ${{ !cancelled() && github.event_name == 'pull_request' && (steps.check.outcome == 'success' || steps.check.outputs.additions != '') }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/suite-results"
          while IFS=$'\t' read -r index suite entry; do
            if [[ "$(cat "$RUNNER_TEMP/entry-logs/$index.status" 2>/dev/null)" == 0 ]]; then
              jq -n --arg suite "$suite" --arg entry "$entry" '{suite: $suite, entry: $entry}'
            fi
          done < <(jq -r '.entries | to_entries[] | [(.key | tostring), .value.suite, .value.entry] | @tsv' <<<"$SHARD") | jq -s . > "$RUNNER_TEMP/suite-results/passed.json"
      - name: Leave the entry files with additions out of the passed list
        id: keep
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.check.outputs.additions != '' }}
        env:
          RECORDING: ${{ steps.recording.outputs.path }}
          ADDITIONS: ${{ steps.check.outputs.additions }}
        run: python3 "$RECORDING/recording.py" keep --additions "$ADDITIONS" "$RUNNER_TEMP/suite-results/passed.json"
      - name: Upload the entry files that passed
        if: ${{ !cancelled() && github.event_name == 'pull_request' && (steps.check.outcome == 'success' || steps.keep.outcome == 'success') }}
        uses: actions/upload-artifact@<pin>
        with:
          name: suite-results-shard-${{ matrix.shard.shard }}
          path: ${{ runner.temp }}/suite-results/passed.json
          retention-days: 1
          if-no-files-found: error
  <windows-job>:
    if: inputs.windows != ''
    runs-on: <windows-runner>
    permissions:
      contents: read
    env:
      WINDOWS: ${{ inputs.windows }}
      SETUPS: ${{ inputs.windows != '' && toJSON(fromJSON(inputs.windows).setups) || '[]' }}
    steps:
      - uses: actions/checkout@<pin>
        with:
          ref: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.sha || '' }}
          persist-credentials: false
      - id: recording
        uses: CrankyAnt/SharedWorkflows/actions/recording@v1
        with:
          digest: ${{ inputs.shared-digest }}
      - name: Start the recording
        id: start
        shell: pwsh
        env:
          RECORDING: ${{ steps.recording.outputs.path }}
        run: python "$env:RECORDING\recording.py" start
      - name: Run the setup <windows-setup> under the recording
        if: contains(fromJSON(env.SETUPS), '<windows-setup>')
        shell: pwsh
        env:
          RECORDING: ${{ steps.recording.outputs.path }}
        run: |
          python "$env:RECORDING\recording.py" exec --setup <windows-setup> -- <windows-setup-command>
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python "$env:RECORDING\recording.py" provide --setup <windows-setup> <windows-setup-provides>
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run the selected Windows entry files under the recording
        shell: pwsh
        env:
          RECORDING: ${{ steps.recording.outputs.path }}
        run: |
          $job = $env:WINDOWS | ConvertFrom-Json
          $failed = @()
          $passed = @()
          foreach ($item in $job.entries) {
            $command = @($item.command)
            Write-Output "::group::$($item.entry)"
            python "$env:RECORDING\recording.py" exec --entry $item.entry --suites .github/suites.json --suite $item.suite -- @command $item.entry
            $status = $LASTEXITCODE
            Write-Output "::endgroup::"
            if ($status -ne 0) {
              Write-Output "::error::$($item.entry) exited with $status"
              $failed += $item.entry
            } else {
              $passed += [ordered]@{ suite = $item.suite; entry = $item.entry }
            }
          }
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\suite-results" | Out-Null
          ConvertTo-Json -InputObject @($passed) -Depth 3 | Set-Content -Path "$env:RUNNER_TEMP\suite-results\passed.json" -Encoding utf8
          if ($failed) { exit 1 }
      - name: Check the recording against the suite list
        id: check
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        uses: CrankyAnt/SharedWorkflows/actions/recording@v1
        with:
          check: "true"
          suites: .github/suites.json
          artifact-name: recording-additions-windows
      - name: Leave the entry files with additions out of the passed list
        id: keep
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.check.outputs.additions != '' }}
        shell: pwsh
        env:
          RECORDING: ${{ steps.recording.outputs.path }}
          ADDITIONS: ${{ steps.check.outputs.additions }}
        run: |
          python "$env:RECORDING\recording.py" keep --additions "$env:ADDITIONS" "$env:RUNNER_TEMP\suite-results\passed.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload the entry files that passed
        if: ${{ !cancelled() && github.event_name == 'pull_request' && (steps.check.outcome == 'success' || steps.keep.outcome == 'success') }}
        uses: actions/upload-artifact@<pin>
        with:
          name: suite-results-windows
          path: ${{ runner.temp }}/suite-results/passed.json
          retention-days: 1
          if-no-files-found: error
