name: <name>
on:
  workflow_call:
    inputs:
      suites:
        type: string
        required: true
      entries:
        type: string
        required: false
      language-steps:
        type: string
        required: false
      shared-digest:
        type: string
        required: true
permissions: {}
jobs:
  <job>:
    if: fromJSON(inputs.suites).<suite> == 'run' || fromJSON(inputs.language-steps).python == 'run'
    runs-on: <runner>
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@<pin>
        with:
          ref: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.sha || '' }}
          persist-credentials: false
      - id: recording
        uses: CrankyAnt/SharedWorkflows/actions/recording@v1
        with:
          digest: ${{ inputs.shared-digest }}
      - name: Set up Python outside the recording
        id: python
        if: fromJSON(inputs.suites).<suite> == 'run'
        uses: actions/setup-python@<pin>
        with:
          python-version: "<python-version>"
          update-environment: false
      - name: Start the recording
        id: start
        if: fromJSON(inputs.suites).<suite> == 'run'
        env:
          RECORDING: ${{ steps.recording.outputs.path }}
        run: python3 "$RECORDING/recording.py" start
      - name: Provide the set-up Python with the lookup report to the entry files that state it
        if: fromJSON(inputs.suites).<suite> == 'run'
        env:
          RECORDING: ${{ steps.recording.outputs.path }}
          PYTHON_PATH: ${{ steps.python.outputs.python-path }}
        run: python3 "$RECORDING/recording.py" provide --setup python --path "$(dirname "$PYTHON_PATH")" --python "$PYTHON_PATH"
      - name: Run the setup <setup> under the recording
        if: fromJSON(inputs.suites).<suite> == 'run'
        env:
          RECORDING: ${{ steps.recording.outputs.path }}
        run: |
          python3 "$RECORDING/recording.py" exec --setup <setup> -- <setup-command>
          python3 "$RECORDING/recording.py" provide --setup <setup> <setup-provides>
      - name: Run the entry files of <suite> under the recording
        if: fromJSON(inputs.suites).<suite> == 'run'
        env:
          RECORDING: ${{ steps.recording.outputs.path }}
          ENTRIES: <entry-files>
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/suite-results"
          failed=0
          for entry in $ENTRIES; do
            if python3 "$RECORDING/recording.py" exec --entry "$entry" --suites .github/suites.json --suite <suite> -- <command> "$entry"; then
              jq -nc --arg entry "$entry" '{suite: "<suite>", entry: $entry}' >> "$RUNNER_TEMP/suite-results/passed.jsonl"
            else
              failed=1
            fi
          done
          exit "$failed"
      - name: Check the recording against the suite list
        id: check
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        uses: CrankyAnt/SharedWorkflows/actions/recording@v1
        with:
          check: "true"
          suites: .github/suites.json
          artifact-name: recording-additions-<job>
      - name: Run the Python language step outside the recording
        if: ${{ !cancelled() && fromJSON(inputs.language-steps).python == 'run' }}
        uses: CrankyAnt/SharedWorkflows/actions/python-language-step@v1
      - name: List the entry files that passed
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.check.outcome == 'success' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/suite-results"
          touch "$RUNNER_TEMP/suite-results/passed.jsonl"
          jq -s . "$RUNNER_TEMP/suite-results/passed.jsonl" > "$RUNNER_TEMP/suite-results/passed.json"
      - name: Upload the entry files that passed
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.check.outcome == 'success' }}
        uses: actions/upload-artifact@<pin>
        with:
          name: suite-results-<job>
          path: ${{ runner.temp }}/suite-results/passed.json
          retention-days: 1
          if-no-files-found: error
  <windows-job>:
    if: fromJSON(inputs.suites).<windows-suite> == 'run'
    runs-on: <windows-runner>
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@<pin>
        with:
          ref: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.sha || '' }}
          persist-credentials: false
      - id: recording
        uses: CrankyAnt/SharedWorkflows/actions/recording@v1
        with:
          digest: ${{ inputs.shared-digest }}
      - name: Start the recording
        id: start
        shell: pwsh
        env:
          RECORDING: ${{ steps.recording.outputs.path }}
        run: python "$env:RECORDING\recording.py" start
      - name: Run the setup <windows-setup> under the recording
        shell: pwsh
        env:
          RECORDING: ${{ steps.recording.outputs.path }}
        run: |
          python "$env:RECORDING\recording.py" exec --setup <windows-setup> -- <windows-setup-command>
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python "$env:RECORDING\recording.py" provide --setup <windows-setup> <windows-setup-provides>
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run the entry files of <windows-suite> under the recording
        shell: pwsh
        env:
          RECORDING: ${{ steps.recording.outputs.path }}
          ENTRIES: <windows-entry-files>
        run: |
          $failed = $false
          $passed = @()
          foreach ($entry in -split $env:ENTRIES) {
            python "$env:RECORDING\recording.py" exec --entry $entry --suites .github/suites.json --suite <windows-suite> -- <windows-command> $entry
            if ($LASTEXITCODE -eq 0) {
              $passed += [ordered]@{ suite = '<windows-suite>'; entry = $entry }
            } else {
              $failed = $true
            }
          }
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\suite-results" | Out-Null
          ConvertTo-Json -InputObject @($passed) -Depth 3 | Set-Content -Path "$env:RUNNER_TEMP\suite-results\passed.json" -Encoding utf8
          if ($failed) { exit 1 }
      - name: Check the recording against the suite list
        id: check
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        uses: CrankyAnt/SharedWorkflows/actions/recording@v1
        with:
          check: "true"
          suites: .github/suites.json
          artifact-name: recording-additions-<windows-job>
      - name: Upload the entry files that passed
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.check.outcome == 'success' }}
        uses: actions/upload-artifact@<pin>
        with:
          name: suite-results-<windows-job>
          path: ${{ runner.temp }}/suite-results/passed.json
          retention-days: 1
          if-no-files-found: error
