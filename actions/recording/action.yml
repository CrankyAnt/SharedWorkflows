name: Shared recording step
description: Expose the recording command, fail the job when its digest differs from the one select took, write the job's environment before its setups, and run its check, uploading additions, entry times or full-recording results as an artifact.
inputs:
  check:
    description: Run `check` against the suite list, upload its additions, entry times or full-recording result, and fail on read additions.
    required: false
    default: "false"
  suites:
    description: The suite list that `check` compares the recording with, relative to the repository root.
    required: false
    default: ""
  artifact-name:
    description: The artifact name for read additions or full-recording results, unique in the run; documents with entry times or list replacements alone switch a `recording-additions*` prefix to `recording-entry-times*`.
    required: false
    default: recording-additions
  digests:
    description: In a consumer, the shared CI digests JSON that select took; the job fails when this step's own digests differ.
    required: false
    default: ""
outputs:
  path:
    description: Absolute path to the recording step; run `python3 <path>/recording.py start|exec|check|keep|apply|digest`, on Windows `python`.
    value: ${{ steps.resources.outputs.path }}
  status:
    description: The exit status of `check`, empty when it did not run; `1` with a non-empty `additions` reports additions, any other non-zero status a recording error.
    value: ${{ steps.check.outputs.status }}
  additions:
    description: Absolute path to the additions document when `check` reports additions, empty otherwise; `recording.py keep` reads it.
    value: ${{ steps.check.outputs.status == '1' && steps.check.outputs.file || '' }}
runs:
  using: composite
  steps:
    - id: resources
      shell: bash
      env:
        RESOURCE_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        printf 'path=%s\n' "$RESOURCE_PATH" >> "$GITHUB_OUTPUT"
    - id: digest
      if: inputs.digests != ''
      shell: bash
      env:
        RESOURCE_PATH: ${{ github.action_path }}
        DIGESTS: ${{ inputs.digests }}
        PYTHON: ${{ runner.os == 'Windows' && 'python' || 'python3' }}
      run: PYTHONPYCACHEPREFIX="$RUNNER_TEMP/repo-pycache" "$PYTHON" "$RESOURCE_PATH/recording.py" digest --expect "$DIGESTS"
    - id: check
      if: inputs.check == 'true'
      shell: bash
      env:
        RESOURCE_PATH: ${{ github.action_path }}
        SUITES: ${{ inputs.suites }}
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
        PYTHON: ${{ runner.os == 'Windows' && 'python' || 'python3' }}
      run: |
        set -uo pipefail
        status=0
        PYTHONPYCACHEPREFIX="$RUNNER_TEMP/repo-pycache" "$PYTHON" "$RESOURCE_PATH/recording.py" check --suites "$SUITES" --artifact-name "$ARTIFACT_NAME" --summary "$GITHUB_STEP_SUMMARY" --github-output "$GITHUB_OUTPUT" || status=$?
        printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
    - if: inputs.check == 'true' && steps.check.outputs.file != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.check.outputs.artifact-name }}
        path: ${{ steps.check.outputs.file }}
        if-no-files-found: error
    - if: inputs.check == 'true' && steps.check.outputs.status != '0'
      shell: bash
      env:
        STATUS: ${{ steps.check.outputs.status }}
        ADDITIONS: ${{ steps.check.outputs.file }}
        ERROR: ${{ steps.check.outputs.error }}
      run: |
        if [ "$STATUS" = 1 ] && [ -n "$ADDITIONS" ]; then
          echo "::error::The recording check failed with exit code $STATUS; the job summary lists the additions."
        else
          message=${ERROR:-the log of the check step holds its error.}
          message=${message//'%'/'%25'}
          message=${message//$'\r'/'%0D'}
          message=${message//$'\n'/'%0A'}
          echo "::error::The recording check failed with exit code $STATUS: $message"
        fi
        exit "$STATUS"
    - if: inputs.check != 'true' && runner.os != 'Windows'
      shell: bash
      env:
        RESOURCE_PATH: ${{ github.action_path }}
      run: python3 "$RESOURCE_PATH/recording.py" base
    - if: inputs.check != 'true' && runner.os == 'Windows'
      shell: pwsh
      env:
        RESOURCE_PATH: ${{ github.action_path }}
      run: python "$env:RESOURCE_PATH\recording.py" base
