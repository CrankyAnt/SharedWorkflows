name: Dependabot auto-merge
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_run: # zizmor: ignore[dangerous-triggers] the merge job checks out nothing and runs no pull-request code
    workflows: [<required-check-workflows>]
    types: [completed]
permissions: {}
jobs:
  dependabot-auto-merge:
    permissions:
      contents: write
      pull-requests: write
    uses: CrankyAnt/SharedWorkflows/.github/workflows/dependabot-auto-merge.yml@v1
