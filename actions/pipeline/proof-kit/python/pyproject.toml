[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "proof-python-project"
version = "0.0.0"
description = "The Python project on which the proof repository runs the pipeline's Python parts at the candidate tag."
requires-python = ">=3.12"

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[tool.setuptools]
py-modules = ["greeting"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F"]

[tool.mypy]
files = ["greeting.py"]
strict = true
