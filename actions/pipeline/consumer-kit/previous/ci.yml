name: CI

on:
  pull_request:
  push:
    branches: [main]
  repository_dispatch:
    types: [dependabot-merged]

permissions: {}

jobs:
  ci:
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
