# Fixed caller: Shared Workflows keeps this file equal to its template; change the template, not this file.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  repository_dispatch:
    types: [dependabot-merged]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.action != 'edited' && 'pr' || 'run' }}-${{ github.event_name == 'pull_request' && github.event.action != 'edited' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'edited' }}

jobs:
  ci:
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    uses: CrankyAnt/SharedWorkflows/.github/workflows/pipeline.yml@v1
