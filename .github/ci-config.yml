version: 1
parts:
  custom:
    setups: [python-3.13, python-3.14]
    script: tests/fixtures/custom/pass.sh
    runner-label: ubuntu-26.04
    paths:
      - tests/fixtures/custom/
  python-verify:
    projects:
      - python-version: "3.14"
        working-directory: tests/fixtures/python_tests
        format-check: true
    paths:
      - tests/fixtures/python_tests/
      - actions/python-language-step/
      - actions/python-tests/
  python-test:
    projects:
      - python-version: "3.14"
        working-directory: tests/fixtures/python_tests
        install: dev
    paths:
      - tests/fixtures/python_tests/
      - actions/python-language-step/
      - actions/python-tests/
  dotnet-test:
    projects:
      - sdk-version: "10.0.x"
        project: tests/fixtures/dotnet_test/Greeting.Tests.csproj
      - sdk-version: "10.0.x"
        project: tests/fixtures/dotnet_console/Greeting.Checks.csproj
        console-runner: true
    paths:
      - tests/fixtures/dotnet_test/
      - tests/fixtures/dotnet_console/
      - actions/dotnet-test/
  node-test:
    projects:
      - working-directory: tests/fixtures/node_test
    paths:
      - tests/fixtures/node_test/
      - actions/node-test/
  suite-selection:
    suites: tests/suites.json
    language-steps: [python]
    pinned-tools: [gitleaks]
  dependabot-auto-merge:
    suites: tests/suites.json
    updater-paths:
      - actions/recording/etw-consumer/build/
  issue-title:
    categories: tests/fixtures/issue_title/categories.json
  additions:
    suites: tests/suites.json
  full-recording:
    suites: tests/suites.json
    validation-workflow: .github/workflows/ci.yml
