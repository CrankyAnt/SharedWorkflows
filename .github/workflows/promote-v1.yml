name: Promote v1 after a read-class change

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: promote-v1
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      follow: ${{ steps.decision.outputs.follow }}
      old: ${{ steps.decision.outputs.old }}
      new: ${{ steps.decision.outputs.new }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read the current v1 tag and the merged pull request
        id: facts
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/repo-pycache" python3 actions/repository-hygiene/promote_v1.py read-tag --repository "$GITHUB_REPOSITORY" --output "$GITHUB_OUTPUT"
          number="$(gh api "repos/$GITHUB_REPOSITORY/commits/$COMMIT/pulls" --jq "[.[] | select(.merge_commit_sha == \"$COMMIT\")][0].number // empty")"
          pins=false
          if [ -n "$number" ]; then
            gh api "repos/$GITHUB_REPOSITORY/pulls/$number" > "$RUNNER_TEMP/pull-request.json"
            case "$(git diff --name-only "$COMMIT^" "$COMMIT" | tr '\n' ' ')" in
              "actions/repository-hygiene/pins.json ") pins=true ;;
            esac
          fi
          printf 'pins=%s\n' "$pins" >> "$GITHUB_OUTPUT"
      - name: Identify the updater App
        if: steps.facts.outputs.pins == 'true'
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.PUBLICATION_CHECKS_APP_CLIENT_ID }}
          private-key: ${{ secrets.PUBLICATION_CHECKS_APP_PRIVATE_KEY }}
          permission-metadata: read
      - name: Decide by promotion class whether v1 follows the commit
        id: decision
        env:
          COMMIT: ${{ github.sha }}
          V1: ${{ steps.facts.outputs.v1 }}
          V1_OBJECT: ${{ steps.facts.outputs.v1_object }}
          APP_LOGIN: ${{ steps.app-token.outputs.app-slug && format('{0}[bot]', steps.app-token.outputs.app-slug) || '' }}
          OWNER: ${{ github.repository_owner }}
        run: PYTHONPYCACHEPREFIX="$RUNNER_TEMP/repo-pycache" python3 actions/repository-hygiene/promote_v1.py decide --commit "$COMMIT" --v1 "$V1" --v1-object "$V1_OBJECT" --pull-request "$RUNNER_TEMP/pull-request.json" --app-login "$APP_LOGIN" --owner "$OWNER" --output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

  await:
    needs: decide
    if: needs.decide.outputs.follow == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 14
    permissions:
      checks: read
      contents: read
    outputs:
      move: ${{ steps.outcome.outputs.move }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Wait for the CI on main
        id: outcome
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.decide.outputs.new }}
          OLD: ${{ needs.decide.outputs.old }}
        run: PYTHONPYCACHEPREFIX="$RUNNER_TEMP/repo-pycache" python3 actions/repository-hygiene/promote_v1.py await --commit "$COMMIT" --old "$OLD" --repository "$GITHUB_REPOSITORY" --output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

  move:
    needs: [decide, await]
    if: needs.await.outputs.move == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    environment: promote-v1
    permissions:
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Move v1 under a lease on its previous commit
        env:
          DEPLOY_KEY: ${{ secrets.PROMOTE_V1_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
          OLD: ${{ needs.decide.outputs.old }}
          NEW: ${{ needs.decide.outputs.new }}
        run: |
          set -euo pipefail
          git remote add promote "git@github.com:$GITHUB_REPOSITORY.git"
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/repo-pycache" python3 actions/repository-hygiene/promote_v1.py move --deploy-key DEPLOY_KEY --remote promote --repository "$GITHUB_REPOSITORY" --old "$OLD" --new "$NEW" --summary "$GITHUB_STEP_SUMMARY"
