name: Rebuild the ETW consumer

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] the job that builds the pull request's code holds a read-only token; the pushing and commenting jobs run no pull-request code
    workflows: [CI]
    types: [completed]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  plan:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_repository.full_name == github.repository && startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rebuild: ${{ steps.pull-request.outputs.rebuild }}
    steps:
      - id: pull-request
        name: Find the run's Dependabot pull request and whether it changes the consumer's source
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::The run's head $HEAD_SHA is no commit id."; exit 1; }
          head_branch="$HEAD_BRANCH" head_sha="$HEAD_SHA" subject="${HEAD_MESSAGE%%$'\n'*}"
          # Begin: the condition under which the rebuild workflow acts on the run, equal in plan and comment.
          rebuild=false
          rebuild_pull_request=""
          if [[ "$head_branch" != dependabot/* ]]; then
            rebuild_reason="the branch $head_branch is no Dependabot branch"
          elif [ "$subject" = "chore: rebuild the ETW consumer" ]; then
            # At most one rebuild per push: a failed run on the rebuild workflow's own commit gets no rebuild.
            rebuild_reason="the head commit $head_sha carries the subject \"$subject\" of the rebuild workflow's own commit, and each push gets at most one rebuild"
          else
            rebuild_pull_request="$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" -f state=open -f "head=$GITHUB_REPOSITORY_OWNER:$head_branch" \
              --jq "[.[] | select(.user.login == \"dependabot[bot]\" and .head.sha == \"$head_sha\")][0].number // empty")"
            if [ -z "$rebuild_pull_request" ]; then
              rebuild_reason="no open pull request by dependabot[bot] has the head $head_sha of $head_branch"
            else
              files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$rebuild_pull_request/files" --jq '.[].filename')"
              source="$(awk '/^actions\/recording\/etw-consumer\// && !/^actions\/recording\/etw-consumer\/build\//' <<<"$files")"
              if [ -n "$source" ]; then
                rebuild=true
                rebuild_reason="the pull request #$rebuild_pull_request by dependabot[bot] changes the source of the ETW consumer: ${source//$'\n'/, }"
              else
                rebuild_reason="the pull request #$rebuild_pull_request by dependabot[bot] changes no source of the ETW consumer"
              fi
            fi
          fi
          # End: the condition under which the rebuild workflow acts on the run.
          if [ "$rebuild" = true ]; then
            echo "The workflow rebuilds the ETW consumer: $rebuild_reason." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The workflow rebuilds nothing: $rebuild_reason." >> "$GITHUB_STEP_SUMMARY"
          fi
          printf 'rebuild=%s\n' "$rebuild" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.rebuild == 'true'
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: actions/recording/etw-consumer/global.json
      - name: Rebuild the consumer from the pull request's source
        run: python actions/recording/etw_consumer_build.py build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: etw-consumer-build
          path: actions/recording/etw-consumer/build/
          if-no-files-found: error

  push:
    needs: [plan, build]
    runs-on: ubuntu-slim
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: pull-request
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: etw-consumer-build
          path: ${{ runner.temp }}/etw-consumer-build
      - name: Download the recording additions of the failed run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/additions"
          names="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[] | select(.expired | not) | .name')"
          if grep -q '^recording-additions-' <<<"$names"; then
            while IFS= read -r name; do
              case "$name" in
                recording-additions-*|recording-entry-times-*)
                  gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$name" --dir "$RUNNER_TEMP/additions/$name"
                  ;;
              esac
            done <<<"$names"
          fi
      - name: Apply the additions to the suite list and replace the consumer's build with the rebuild
        run: |
          set -euo pipefail
          shopt -s nullglob
          additions=("$RUNNER_TEMP"/additions/*/additions.json)
          if [ "${#additions[@]}" -gt 0 ]; then
            PYTHONPYCACHEPREFIX="$RUNNER_TEMP/repo-pycache" python3 actions/recording/recording.py apply --root pull-request --suites pull-request/tests/suites.json --summary "$GITHUB_STEP_SUMMARY" "${additions[@]}"
          fi
          build=pull-request/actions/recording/etw-consumer/build
          rm -rf "$build"
          cp -R "$RUNNER_TEMP/etw-consumer-build" "$build"
      - id: changes
        name: Check the changed files
        run: |
          set -euo pipefail
          git -C pull-request config core.fileMode false
          git -C pull-request add -A
          git -C pull-request diff --cached --check
          changed="$(git -C pull-request diff --cached --name-only)"
          if [ -z "$changed" ]; then
            echo "The committed build equals the rebuild and the run uploaded no recording additions to apply; nothing to commit." >> "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          while IFS= read -r path; do
            case "$path" in
              actions/recording/etw-consumer/build/*|tests/suites.json) ;;
              *) echo "::error::Unexpected changed file: $path"; exit 1 ;;
            esac
          done <<<"$changed"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app-token
        if: steps.changes.outputs.changed == 'true'
        with:
          client-id: ${{ vars.PUBLICATION_CHECKS_APP_CLIENT_ID }}
          private-key: ${{ secrets.PUBLICATION_CHECKS_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Commit the rebuild as the GitHub App
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_LOGIN: ${{ steps.app-token.outputs.app-slug }}[bot]
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          app_id="$(gh api "users/$APP_LOGIN" --jq .id)"
          git -C pull-request config user.name "$APP_LOGIN"
          git -C pull-request config user.email "$app_id+$APP_LOGIN@users.noreply.github.com"
          # Dependabot keeps rebasing its pull request over a commit whose message holds [dependabot skip].
          git -C pull-request commit -m "chore: rebuild the ETW consumer" -m "Rebuilt from the source of $HEAD_SHA, with the recording additions of $RUN_URL." -m "[dependabot skip]"
      - name: Install the pinned Gitleaks
        if: steps.changes.outputs.changed == 'true'
        run: PYTHONPYCACHEPREFIX="$RUNNER_TEMP/repo-pycache" python3 actions/repository-hygiene/install_tools.py --pins actions/repository-hygiene/pins.json --platform linux-x64 --tool gitleaks --destination "$RUNNER_TEMP/hygiene-tools"
      - name: Scan the commit before pushing
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git -C pull-request -c credential.helper= -c 'credential.helper=!gh auth git-credential' fetch --depth=1 origin "refs/heads/$HEAD_BRANCH:refs/remotes/origin/$HEAD_BRANCH"
          # A moved branch is not pushed to; the push step stops on the same comparison.
          [ "$(git -C pull-request rev-parse "refs/remotes/origin/$HEAD_BRANCH")" = "$HEAD_SHA" ] || exit 0
          "$RUNNER_TEMP/hygiene-tools/gitleaks" git pull-request --config .gitleaks.toml --baseline-path .gitleaks-baseline.json --log-opts="HEAD --not --remotes=origin" --redact --no-banner --no-color
      - name: Push the rebuild to the pull request's branch
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          remote="$(git -C pull-request rev-parse "refs/remotes/origin/$HEAD_BRANCH")"
          if [ "$remote" != "$HEAD_SHA" ]; then
            echo "The branch $HEAD_BRANCH moved from $HEAD_SHA to $remote; its own run decides on the new head." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The additions workflow can push onto the same run's head first; the push is then no fast-forward and is refused.
          if ! git -C pull-request -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin "HEAD:refs/heads/$HEAD_BRANCH"; then
            remote="$(git -C pull-request -c credential.helper= -c 'credential.helper=!gh auth git-credential' ls-remote origin "refs/heads/$HEAD_BRANCH" | cut -f1)"
            if [ "$remote" != "$HEAD_SHA" ]; then
              echo "The branch $HEAD_BRANCH moved from $HEAD_SHA to ${remote:-nothing}; nothing is pushed, and its own run decides." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            exit 1
          fi

  comment:
    needs: [plan, build, push]
    if: always() && (needs.plan.result == 'failure' || needs.plan.result == 'cancelled' || needs.build.result == 'failure' || needs.build.result == 'cancelled' || needs.push.result == 'failure' || needs.push.result == 'cancelled')
    runs-on: ubuntu-slim
    permissions:
      pull-requests: write
    steps:
      - name: Comment on the pull request with the failed run and the manual route
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::The run's head $HEAD_SHA is no commit id."; exit 1; }
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::The run id $RUN_ID is no number."; exit 1; }
          # The plan job's condition, evaluated again: also after a failed plan job, and false once the branch moved since the run.
          head_branch="$HEAD_BRANCH" head_sha="$HEAD_SHA" subject="${HEAD_MESSAGE%%$'\n'*}"
          # Begin: the condition under which the rebuild workflow acts on the run, equal in plan and comment.
          rebuild=false
          rebuild_pull_request=""
          if [[ "$head_branch" != dependabot/* ]]; then
            rebuild_reason="the branch $head_branch is no Dependabot branch"
          elif [ "$subject" = "chore: rebuild the ETW consumer" ]; then
            # At most one rebuild per push: a failed run on the rebuild workflow's own commit gets no rebuild.
            rebuild_reason="the head commit $head_sha carries the subject \"$subject\" of the rebuild workflow's own commit, and each push gets at most one rebuild"
          else
            rebuild_pull_request="$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" -f state=open -f "head=$GITHUB_REPOSITORY_OWNER:$head_branch" \
              --jq "[.[] | select(.user.login == \"dependabot[bot]\" and .head.sha == \"$head_sha\")][0].number // empty")"
            if [ -z "$rebuild_pull_request" ]; then
              rebuild_reason="no open pull request by dependabot[bot] has the head $head_sha of $head_branch"
            else
              files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$rebuild_pull_request/files" --jq '.[].filename')"
              source="$(awk '/^actions\/recording\/etw-consumer\// && !/^actions\/recording\/etw-consumer\/build\//' <<<"$files")"
              if [ -n "$source" ]; then
                rebuild=true
                rebuild_reason="the pull request #$rebuild_pull_request by dependabot[bot] changes the source of the ETW consumer: ${source//$'\n'/, }"
              else
                rebuild_reason="the pull request #$rebuild_pull_request by dependabot[bot] changes no source of the ETW consumer"
              fi
            fi
          fi
          # End: the condition under which the rebuild workflow acts on the run.
          if [ "$rebuild" != true ]; then
            echo "The workflow committed nothing, and no comment follows: $rebuild_reason." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          body="$RUNNER_TEMP/rebuild-etw-consumer-comment.md"
          fence="$(printf '\140\140\140')"
          {
            printf 'The rebuild workflow did not commit a rebuilt ETW consumer onto this branch: [its workflow run](%s) failed or was cancelled.\n\n' "$WORKFLOW_RUN_URL"
            printf 'When [run %s](%s) reported additions that were not applied, apply them by hand from the default branch:\n\n%ssh\ngh workflow run automation-caller.yml -f part=additions -f run-id=%s\n%s\n\n' "$RUN_ID" "$RUN_URL" "$fence" "$RUN_ID" "$fence"
            printf 'The additions workflow then opens a pull request onto this branch whose only change is the suite list; merge it once its checks pass. '
            printf 'Rebuild the consumer as [Change the ETW consumer](%s/%s/blob/HEAD/docs/maintaining.md#change-the-etw-consumer) says.\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY"
          } > "$body"
          gh pr comment "$rebuild_pull_request" --repo "$GITHUB_REPOSITORY" --body-file "$body"
