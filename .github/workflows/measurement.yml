name: Measurement

on:
  workflow_call:
    secrets:
      MEASUREMENT_APP_PRIVATE_KEY:
        description: The private key of the measurement App. The job reads it from the environment measurement of the calling repository.
        required: false

permissions: {}

concurrency:
  group: measurement
  cancel-in-progress: false

jobs:
  measurement:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-slim
    timeout-minutes: 13
    environment: measurement
    permissions:
      actions: read
      issues: write
    steps:
      - name: Load the measurement program from this workflow revision
        id: resources
        uses: $/actions/measurement
      - name: Get the installation token of the measurement App
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.MEASUREMENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.MEASUREMENT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }} # zizmor: ignore[github-app] the measurement reads every repository of the installation, so that no file names one
          permission-actions: read
      - name: Measure the CI goal for every repository of the installation
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
          RESOURCE_PATH: ${{ steps.resources.outputs.path }}
        run: PYTHONPYCACHEPREFIX="$RUNNER_TEMP/repo-pycache" python3 "$RESOURCE_PATH/measurement.py" measure --own-repository "$GITHUB_REPOSITORY" --store-out measurement-records.json --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload the measurement records store
        if: ${{ always() && hashFiles('measurement-records.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: measurement-records
          path: measurement-records.json
          retention-days: 30
          if-no-files-found: error
      - name: Close the issue for a failed run after success
        if: ${{ success() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RESOURCE_PATH: ${{ steps.resources.outputs.path }}
        run: PYTHONPYCACHEPREFIX="$RUNNER_TEMP/repo-pycache" python3 "$RESOURCE_PATH/measurement.py" success --own-repository "$GITHUB_REPOSITORY" --summary "$GITHUB_STEP_SUMMARY"
      - name: Open an issue for a failed run
        if: ${{ failure() || cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RESOURCE_PATH: ${{ steps.resources.outputs.path }}
        run: PYTHONPYCACHEPREFIX="$RUNNER_TEMP/repo-pycache" python3 "$RESOURCE_PATH/measurement.py" failure --own-repository "$GITHUB_REPOSITORY" --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --summary "$GITHUB_STEP_SUMMARY"
