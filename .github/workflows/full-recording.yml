name: Full recording

on:
  schedule:
    # Mondays at 03:17 UTC; the plan job records only in even ISO weeks, so the schedule records every two weeks.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      run: ${{ steps.week.outputs.run }}
      shards: ${{ steps.select.outputs.shards }}
      windows: ${{ steps.select.outputs.windows }}
    steps:
      - id: week
        name: Record every two weeks on the schedule and always when started by hand
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != schedule ] || [ $((10#$(date -u +%V) % 2)) -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "An odd ISO week: the full recording runs next week." >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.week.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - id: select
        name: Shard every entry file for the full recording
        if: steps.week.outputs.run == 'true'
        run: PYTHONPYCACHEPREFIX="$RUNNER_TEMP/repo-pycache" python3 actions/suite-selection/suite_selection.py select --root . --suites tests/suites.json --full --json-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

  linux:
    needs: plan
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.shards != '' && needs.plan.outputs.shards != '[]'
    name: shard ${{ matrix.shard.shard }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      SHARD: ${{ toJSON(matrix.shard) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: recording
        uses: $/actions/recording
      - id: python
        if: contains(matrix.shard.setups, 'python')
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          update-environment: false
      - name: Start the full recording
        id: start
        env:
          RECORDING: ${{ steps.recording.outputs.path }}
        run: python3 "$RECORDING/recording.py" start --full
      - name: Provide the set-up Python with the lookup report to the entry files that state it
        if: contains(matrix.shard.setups, 'python')
        env:
          RECORDING: ${{ steps.recording.outputs.path }}
          PYTHON_PATH: ${{ steps.python.outputs.python-path }}
        run: python3 "$RECORDING/recording.py" provide --setup python --path "$(dirname "$PYTHON_PATH")" --python "$PYTHON_PATH"
      - name: Install the pinned tools of the shard's setups under the recording
        if: contains(matrix.shard.setups, 'actionlint') || contains(matrix.shard.setups, 'zizmor') || contains(matrix.shard.setups, 'gitleaks') || contains(matrix.shard.setups, 'reuse') || contains(matrix.shard.setups, 'ruff') || contains(matrix.shard.setups, 'mypy')
        env:
          RECORDING: ${{ steps.recording.outputs.path }}
          SETUPS: ${{ join(matrix.shard.setups, ' ') }}
        run: |
          set -euo pipefail
          for setup in actionlint zizmor gitleaks reuse ruff mypy; do
            [[ " $SETUPS " == *" $setup "* ]] || continue
            tools=(--tool "$setup")
            if [[ "$setup" == actionlint ]]; then tools+=(--tool shellcheck); fi
            python3 "$RECORDING/recording.py" exec --setup "$setup" -- python3 actions/repository-hygiene/install_tools.py --pins actions/repository-hygiene/pins.json --platform linux-x64 --destination "$RUNNER_TEMP/setups/$setup" "${tools[@]}"
            python3 "$RECORDING/recording.py" provide --setup "$setup" --path "$RUNNER_TEMP/setups/$setup"
          done
      - name: Read the pinned Node.js version under the recording
        id: node
        if: contains(matrix.shard.setups, 'node')
        env:
          RECORDING: ${{ steps.recording.outputs.path }}
        run: |
          set -euo pipefail
          version="$(python3 "$RECORDING/recording.py" exec --setup node -- python3 -c "import json; print(json.load(open('actions/repository-hygiene/pins.json'))['node']['version'])")"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - if: contains(matrix.shard.setups, 'node')
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          package-manager-cache: false
      - name: Provide the set-up Node.js to the entry files that state it
        if: contains(matrix.shard.setups, 'node')
        env:
          RECORDING: ${{ steps.recording.outputs.path }}
          VERSION: ${{ steps.node.outputs.version }}
        run: python3 "$RECORDING/recording.py" provide --setup node --path "$RUNNER_TOOL_CACHE/node/$VERSION/x64/bin"
      - name: Provision the locked commitlint toolchain under the recording
        if: contains(matrix.shard.setups, 'commitlint')
        env:
          RECORDING: ${{ steps.recording.outputs.path }}
          npm_config_update_notifier: "false"
        run: |
          set -euo pipefail
          location="$RUNNER_TEMP/setups/commitlint"
          mkdir -p "$location"
          # shellcheck disable=SC2016 # the inner script expands $1 itself
          python3 "$RECORDING/recording.py" exec --setup commitlint -- bash -c 'cp actions/publication-checks/package.json actions/publication-checks/package-lock.json "$1/" && cd "$1" && npm ci --ignore-scripts --no-audit --no-fund --userconfig /dev/null --prefix "$1"' _ "$location"
          python3 "$RECORDING/recording.py" provide --setup commitlint --variable "PUBLICATION_CHECKS_TOOLS=$location"
      - name: Run the shard's entry files under the recording, two at a time
        env:
          RECORDING: ${{ steps.recording.outputs.path }}
        run: |
          set -uo pipefail
          export LOGS="$RUNNER_TEMP/entry-logs"
          mkdir -p "$LOGS"
          # shellcheck disable=SC2329 # xargs invokes run_entry through bash -c
          run_entry() {
            local suite entry name command
            suite="$(jq -r .suite <<<"$1")"
            entry="$(jq -r .entry <<<"$1")"
            mapfile -t command < <(jq -r '.command[]' <<<"$1")
            name="${entry//\//_}"
            python3 "$RECORDING/recording.py" exec --entry "$entry" --suites tests/suites.json --suite "$suite" -- "${command[@]}" "$entry" > "$LOGS/$name.log" 2>&1
            echo "$?" > "$LOGS/$name.status"
            echo "$entry exited with $(cat "$LOGS/$name.status")"
          }
          export -f run_entry
          # shellcheck disable=SC2016 # the inner script expands $1 itself
          jq -c '.entries[]' <<<"$SHARD" | xargs -d '\n' -r -n 1 -P 2 bash -c 'run_entry "$1"' _
          failed=0
          while IFS= read -r entry; do
            name="${entry//\//_}"
            echo "::group::$entry"
            cat "$LOGS/$name.log"
            echo "::endgroup::"
            if [[ "$(cat "$LOGS/$name.status" 2>/dev/null)" != 0 ]]; then
              echo "::error::$entry failed"
              failed=1
            fi
          done < <(jq -r '.entries[].entry' <<<"$SHARD")
          exit "$failed"
      - name: Parse and classify the shard's recording and upload its result
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        uses: $/actions/recording
        with:
          check: "true"
          suites: tests/suites.json
          artifact-name: full-recording-shard-${{ matrix.shard.shard }}

  windows:
    needs: plan
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.windows != ''
    runs-on: windows-2025
    permissions:
      contents: read
    env:
      WINDOWS: ${{ needs.plan.outputs.windows }}
      SETUPS: ${{ needs.plan.outputs.windows != '' && toJSON(fromJSON(needs.plan.outputs.windows).setups) || '[]' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - id: recording
        uses: $/actions/recording
      - id: python
        if: contains(fromJSON(env.SETUPS), 'python')
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          update-environment: false
      - if: contains(fromJSON(env.SETUPS), 'dotnet')
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}\setups\dotnet
        with:
          global-json-file: actions/recording/etw-consumer/global.json
      - name: Start the full recording
        id: start
        shell: pwsh
        env:
          RECORDING: ${{ steps.recording.outputs.path }}
        run: python "$env:RECORDING\recording.py" start --full
      - name: Provide the set-up Python with the lookup report to the entry files that state it
        if: contains(fromJSON(env.SETUPS), 'python')
        shell: pwsh
        env:
          RECORDING: ${{ steps.recording.outputs.path }}
          PYTHON_PATH: ${{ steps.python.outputs.python-path }}
        run: |
          python "$env:RECORDING\recording.py" provide --setup python --path (Split-Path -Parent $env:PYTHON_PATH) --path (Join-Path (Split-Path -Parent $env:PYTHON_PATH) 'Scripts') --python $env:PYTHON_PATH
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Provide the set-up .NET to the entry files that state it
        if: contains(fromJSON(env.SETUPS), 'dotnet')
        shell: pwsh
        env:
          RECORDING: ${{ steps.recording.outputs.path }}
        run: |
          python "$env:RECORDING\recording.py" provide --setup dotnet --path $env:DOTNET_ROOT --variable "DOTNET_ROOT=$env:DOTNET_ROOT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run the selected Windows entry files under the recording
        shell: pwsh
        env:
          RECORDING: ${{ steps.recording.outputs.path }}
          # The runner provides an 8.3 short-form TEMP under the profile; the entry files get its long form.
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $job = $env:WINDOWS | ConvertFrom-Json
          $failed = @()
          $passed = @()
          foreach ($item in $job.entries) {
            $command = @($item.command)
            Write-Output "::group::$($item.entry)"
            python "$env:RECORDING\recording.py" exec --entry $item.entry --suites tests/suites.json --suite $item.suite -- @command $item.entry
            $status = $LASTEXITCODE
            Write-Output "::endgroup::"
            if ($status -ne 0) {
              Write-Output "::error::$($item.entry) exited with $status"
              $failed += $item.entry
            } else {
              $passed += [ordered]@{ suite = $item.suite; entry = $item.entry }
            }
          }
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\suite-results" | Out-Null
          ConvertTo-Json -InputObject @($passed) -Depth 3 | Set-Content -Path "$env:RUNNER_TEMP\suite-results\passed.json" -Encoding utf8
          if ($failed) { exit 1 }
      - name: Classify the Windows recording and upload its result
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        uses: $/actions/recording
        with:
          check: "true"
          suites: tests/suites.json
          artifact-name: full-recording-windows

  close:
    needs: [plan, linux, windows]
    if: ${{ !cancelled() && needs.plan.outputs.run == 'true' }}
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: full-recording-*
          path: ${{ runner.temp }}/full-recording
      - id: recording
        uses: $/actions/recording
      - name: Join the results, apply the removals and write the duration estimates
        env:
          RECORDING: ${{ steps.recording.outputs.path }}
          REPORT: ${{ runner.temp }}/full-recording-report.md
        run: |
          set -euo pipefail
          printf 'The full recording of run %s/%s/actions/runs/%s.\n\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$REPORT"
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/repo-pycache" python3 "$RECORDING/recording.py" apply --suites tests/suites.json --summary "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP"/full-recording/*/full-recording.json | sed 's/^/- /' >> "$REPORT"
      - id: changes
        name: Find whether the stored lists changed
        run: |
          set -euo pipefail
          if git diff --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: full-recording-joined
          path: |
            tests/suites.json
            ${{ runner.temp }}/full-recording-report.md
          if-no-files-found: error
      - name: Check the changed files
        if: steps.changes.outputs.changed == 'true' && github.ref_name == github.event.repository.default_branch
        run: |
          set -euo pipefail
          git diff --name-only | while IFS= read -r path; do
            case "$path" in
              tests/suites.json) ;;
              *) echo "Unexpected changed file: $path" >&2; exit 1 ;;
            esac
          done
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        if: steps.changes.outputs.changed == 'true' && github.ref_name == github.event.repository.default_branch
        with:
          client-id: ${{ vars.PUBLICATION_CHECKS_APP_CLIENT_ID }}
          private-key: ${{ secrets.PUBLICATION_CHECKS_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Configure the GitHub App identity
        if: steps.changes.outputs.changed == 'true' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_LOGIN: ${{ steps.app-token.outputs.app-slug }}[bot]
        run: |
          set -euo pipefail
          app_id="$(gh api "users/$APP_LOGIN" --jq .id)"
          git config user.name "$APP_LOGIN"
          git config user.email "$app_id+$APP_LOGIN@users.noreply.github.com"
      - name: Commit the recorded lists
        if: steps.changes.outputs.changed == 'true' && github.ref_name == github.event.repository.default_branch
        run: |
          set -euo pipefail
          git add tests/suites.json
          git diff --cached --check
          git commit -m "chore: update the recorded path lists"
      - name: Install the pinned Gitleaks
        if: steps.changes.outputs.changed == 'true' && github.ref_name == github.event.repository.default_branch
        run: PYTHONPYCACHEPREFIX="$RUNNER_TEMP/repo-pycache" python3 actions/repository-hygiene/install_tools.py --pins actions/repository-hygiene/pins.json --platform linux-x64 --tool gitleaks --destination "$RUNNER_TEMP/hygiene-tools"
      - name: Scan the commit before pushing
        if: steps.changes.outputs.changed == 'true' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' fetch --prune origin
          "$RUNNER_TEMP/hygiene-tools/gitleaks" git --config .gitleaks.toml --baseline-path .gitleaks-baseline.json --log-opts="HEAD --not --remotes=origin" --redact --no-banner --no-color
      - name: Push the review branch
        id: push
        if: steps.changes.outputs.changed == 'true' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          branch="chore/update-recorded-lists"
          if git -c credential.helper= -c 'credential.helper=!gh auth git-credential' ls-remote --exit-code --heads origin "refs/heads/$branch" > /dev/null; then
            git -c credential.helper= -c 'credential.helper=!gh auth git-credential' fetch --no-tags origin "refs/heads/$branch:refs/remotes/origin/$branch"
            remote_tip="$(git rev-parse --verify "refs/remotes/origin/$branch")"
          else
            remote_tip=""
          fi
          git switch -C "$branch"
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push --force-with-lease="refs/heads/$branch:$remote_tip" origin "HEAD:refs/heads/$branch"
      - name: Create or update the review pull request
        id: pull-request
        if: steps.changes.outputs.changed == 'true' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          branch="chore/update-recorded-lists"
          title="chore: update the recorded path lists"
          url="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --base "$DEFAULT_BRANCH" --state open --json url --jq '.[0].url')"
          if [ -n "$url" ]; then
            gh pr edit "$url" --title "$title" --body-file "$RUNNER_TEMP/full-recording-report.md"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base "$DEFAULT_BRANCH" --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/full-recording-report.md"
          fi
      - id: stopped
        name: Name the App setting this run would need
        if: ${{ failure() && (steps.app-token.outcome == 'failure' || steps.push.outcome == 'failure' || steps.pull-request.outcome == 'failure') }}
        run: |
          echo "::error::The updater App could not propose the recorded lists with its existing installation and credentials. Any other App or repository setting is a question to the user under docs/agents/publication.md; the joined result is the artifact full-recording-joined."
          exit 1
