name: GitHub release

on:
  workflow_call:

permissions: {}

jobs:
  plan:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - name: Load the release program from this workflow revision
        id: resources
        uses: $/actions/pipeline
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide from the configuration file, the tag and its signature whether the run publishes
        id: plan
        env:
          RESOURCE_PATH: ${{ steps.resources.outputs.path }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: PYTHONPYCACHEPREFIX="$RUNNER_TEMP/repo-pycache" python3 "$RESOURCE_PATH/release.py" plan --root . --ref "$REF" --default-branch "$DEFAULT_BRANCH" --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

  github-release-files:
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.plan).parts['github-release'].run }}
    runs-on: ${{ fromJSON(needs.plan.outputs.plan).parts['github-release'].runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(needs.plan.outputs.plan).parts['github-release'].commit }}
          persist-credentials: false
      # One place per known setup, each with one step per tool, so that any list of setups installs in its listed order.
      - name: Set up Python for setup 1
        if: ${{ fromJSON(needs.plan.outputs.plan).parts['github-release'].setups[0].tool == 'python' }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ fromJSON(needs.plan.outputs.plan).parts['github-release'].setups[0].version }}
      - name: Set up .NET for setup 1
        if: ${{ fromJSON(needs.plan.outputs.plan).parts['github-release'].setups[0].tool == 'dotnet' }}
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ fromJSON(needs.plan.outputs.plan).parts['github-release'].setups[0].version }}
      - name: Set up Python for setup 2
        if: ${{ fromJSON(needs.plan.outputs.plan).parts['github-release'].setups[1].tool == 'python' }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ fromJSON(needs.plan.outputs.plan).parts['github-release'].setups[1].version }}
      - name: Set up .NET for setup 2
        if: ${{ fromJSON(needs.plan.outputs.plan).parts['github-release'].setups[1].tool == 'dotnet' }}
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ fromJSON(needs.plan.outputs.plan).parts['github-release'].setups[1].version }}
      - name: Set up Python for setup 3
        if: ${{ fromJSON(needs.plan.outputs.plan).parts['github-release'].setups[2].tool == 'python' }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ fromJSON(needs.plan.outputs.plan).parts['github-release'].setups[2].version }}
      - name: Set up .NET for setup 3
        if: ${{ fromJSON(needs.plan.outputs.plan).parts['github-release'].setups[2].tool == 'dotnet' }}
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ fromJSON(needs.plan.outputs.plan).parts['github-release'].setups[2].version }}
      - name: Set up Python for setup 4
        if: ${{ fromJSON(needs.plan.outputs.plan).parts['github-release'].setups[3].tool == 'python' }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ fromJSON(needs.plan.outputs.plan).parts['github-release'].setups[3].version }}
      - name: Set up .NET for setup 4
        if: ${{ fromJSON(needs.plan.outputs.plan).parts['github-release'].setups[3].tool == 'dotnet' }}
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ fromJSON(needs.plan.outputs.plan).parts['github-release'].setups[3].version }}
      - name: Set up Python for setup 5
        if: ${{ fromJSON(needs.plan.outputs.plan).parts['github-release'].setups[4].tool == 'python' }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ fromJSON(needs.plan.outputs.plan).parts['github-release'].setups[4].version }}
      - name: Set up .NET for setup 5
        if: ${{ fromJSON(needs.plan.outputs.plan).parts['github-release'].setups[4].tool == 'dotnet' }}
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ fromJSON(needs.plan.outputs.plan).parts['github-release'].setups[4].version }}
      - name: Set up Python for setup 6
        if: ${{ fromJSON(needs.plan.outputs.plan).parts['github-release'].setups[5].tool == 'python' }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ fromJSON(needs.plan.outputs.plan).parts['github-release'].setups[5].version }}
      - name: Set up .NET for setup 6
        if: ${{ fromJSON(needs.plan.outputs.plan).parts['github-release'].setups[5].tool == 'dotnet' }}
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ fromJSON(needs.plan.outputs.plan).parts['github-release'].setups[5].version }}
      - name: Run the script of the repository that writes the files
        if: ${{ fromJSON(needs.plan.outputs.plan).parts['github-release'].script != '' }}
        shell: bash
        env:
          SCRIPT: ${{ fromJSON(needs.plan.outputs.plan).parts['github-release'].script }}
        run: bash -- "$SCRIPT"
      - name: Collect the files of the release
        shell: bash
        env:
          FILES: ${{ fromJSON(needs.plan.outputs.plan).parts['github-release'].files }}
          COLLECTED: ${{ runner.temp }}/release-files
        run: |
          mkdir -p "$COLLECTED"
          while IFS= read -r file; do
            if [ ! -f "$file" ]; then
              echo "::error::The file $file of the release does not exist."
              exit 1
            fi
            cp -- "$file" "$COLLECTED/"
          done <<< "$FILES"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: ${{ runner.temp }}/release-files/
          if-no-files-found: error
          retention-days: 1

  github-release:
    needs: [plan, github-release-files]
    if: ${{ fromJSON(needs.plan.outputs.plan).parts['github-release'].run }}
    runs-on: ubuntu-26.04
    permissions:
      attestations: write
      contents: write
      id-token: write
    concurrency:
      group: github-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Load the release program from this workflow revision
        id: resources
        uses: $/actions/pipeline
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: ${{ runner.temp }}/release-files
      - name: Attest the build provenance of the files
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release-files/*
      - name: Publish the release with the files
        env:
          RESOURCE_PATH: ${{ steps.resources.outputs.path }}
          GITHUB_TOKEN: ${{ github.token }}
          PLAN: ${{ needs.plan.outputs.plan }}
        run: |
          printf '%s' "$PLAN" > "$RUNNER_TEMP/release-plan.json"
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/repo-pycache" python3 "$RESOURCE_PATH/release.py" publish --plan "$RUNNER_TEMP/release-plan.json" --files "$RUNNER_TEMP/release-files" --summary "$GITHUB_STEP_SUMMARY"
