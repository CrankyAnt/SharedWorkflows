name: Pipeline

on:
  workflow_call:

permissions: {}

jobs:
  plan:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      concurrency: ${{ steps.plan.outputs.concurrency }}
    steps:
      - name: Load the plan program from this workflow revision
        id: resources
        uses: $/actions/pipeline
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the configuration file and decide which parts run
        id: plan
        env:
          RESOURCE_PATH: ${{ steps.resources.outputs.path }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          COMPARE: ${{ github.event_name == 'pull_request' && 'merge-base' || 'direct' }}
          WORKFLOW: ${{ github.workflow }}
          EVENT: ${{ github.event_name }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        run: PYTHONPYCACHEPREFIX="$RUNNER_TEMP/repo-pycache" python3 "$RESOURCE_PATH/plan.py" plan --root . --base "$BASE" --head "$HEAD" --compare "$COMPARE" --workflow "$WORKFLOW" --event "$EVENT" --pull-request "$PULL_REQUEST" --run-id "$RUN_ID" --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

  custom:
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.plan).parts['custom'].run }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    concurrency:
      group: ${{ fromJSON(needs.plan.outputs.concurrency || '{}')['custom'].group }}
      cancel-in-progress: ${{ fromJSON(needs.plan.outputs.concurrency || '{}')['custom']['cancel-in-progress'] == true }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # One place per known setup, each with one step per tool, so that any list of setups installs in its listed order.
      - name: Set up Python for setup 1
        if: ${{ fromJSON(needs.plan.outputs.plan).parts['custom'].setups[0].tool == 'python' }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ fromJSON(needs.plan.outputs.plan).parts['custom'].setups[0].version }}
      - name: Set up .NET for setup 1
        if: ${{ fromJSON(needs.plan.outputs.plan).parts['custom'].setups[0].tool == 'dotnet' }}
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ fromJSON(needs.plan.outputs.plan).parts['custom'].setups[0].version }}
      - name: Set up Python for setup 2
        if: ${{ fromJSON(needs.plan.outputs.plan).parts['custom'].setups[1].tool == 'python' }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ fromJSON(needs.plan.outputs.plan).parts['custom'].setups[1].version }}
      - name: Set up .NET for setup 2
        if: ${{ fromJSON(needs.plan.outputs.plan).parts['custom'].setups[1].tool == 'dotnet' }}
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ fromJSON(needs.plan.outputs.plan).parts['custom'].setups[1].version }}
      - name: Set up Python for setup 3
        if: ${{ fromJSON(needs.plan.outputs.plan).parts['custom'].setups[2].tool == 'python' }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ fromJSON(needs.plan.outputs.plan).parts['custom'].setups[2].version }}
      - name: Set up .NET for setup 3
        if: ${{ fromJSON(needs.plan.outputs.plan).parts['custom'].setups[2].tool == 'dotnet' }}
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ fromJSON(needs.plan.outputs.plan).parts['custom'].setups[2].version }}
      - name: Set up Python for setup 4
        if: ${{ fromJSON(needs.plan.outputs.plan).parts['custom'].setups[3].tool == 'python' }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ fromJSON(needs.plan.outputs.plan).parts['custom'].setups[3].version }}
      - name: Set up .NET for setup 4
        if: ${{ fromJSON(needs.plan.outputs.plan).parts['custom'].setups[3].tool == 'dotnet' }}
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ fromJSON(needs.plan.outputs.plan).parts['custom'].setups[3].version }}
      - name: Set up Python for setup 5
        if: ${{ fromJSON(needs.plan.outputs.plan).parts['custom'].setups[4].tool == 'python' }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ fromJSON(needs.plan.outputs.plan).parts['custom'].setups[4].version }}
      - name: Set up .NET for setup 5
        if: ${{ fromJSON(needs.plan.outputs.plan).parts['custom'].setups[4].tool == 'dotnet' }}
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ fromJSON(needs.plan.outputs.plan).parts['custom'].setups[4].version }}
      - name: Set up Python for setup 6
        if: ${{ fromJSON(needs.plan.outputs.plan).parts['custom'].setups[5].tool == 'python' }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ fromJSON(needs.plan.outputs.plan).parts['custom'].setups[5].version }}
      - name: Set up .NET for setup 6
        if: ${{ fromJSON(needs.plan.outputs.plan).parts['custom'].setups[5].tool == 'dotnet' }}
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ fromJSON(needs.plan.outputs.plan).parts['custom'].setups[5].version }}
      - name: Run the script of the repository
        env:
          SCRIPT: ${{ fromJSON(needs.plan.outputs.plan).parts['custom'].config.script }}
        run: bash -- "$SCRIPT"

  repository-hygiene:
    needs: plan
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    concurrency:
      group: ${{ fromJSON(needs.plan.outputs.concurrency || '{}')['repository-hygiene'].group || format('repository-hygiene-run-{0}', github.run_id) }}
      cancel-in-progress: ${{ fromJSON(needs.plan.outputs.concurrency || '{}')['repository-hygiene']['cancel-in-progress'] == true }}
    steps:
      - name: Load resources from this workflow revision
        id: resources
        uses: $/actions/repository-hygiene
      - name: Load the push lookup from this workflow revision
        id: selection
        uses: $/actions/suite-selection
      - name: Load the fixed callers and the schema from this workflow revision
        id: pipeline
        uses: $/actions/pipeline
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Look up the tested tree of the pushed commit's pull request
        if: github.event_name == 'push'
        env:
          SELECTION_PATH: ${{ steps.selection.outputs.path }}
          GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW: ${{ github.workflow_ref }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: PYTHONPYCACHEPREFIX="$RUNNER_TEMP/repo-pycache" python3 "$SELECTION_PATH/suite_selection.py" lookup --root . --sha "$SHA" --before "$BEFORE" --workflow "$WORKFLOW" --run-attempt "$RUN_ATTEMPT" --output "$RUNNER_TEMP/push-lookup.json" --summary "$GITHUB_STEP_SUMMARY"
      - name: Decide which checks the changed files can affect
        id: changes
        env:
          RESOURCE_PATH: ${{ steps.resources.outputs.path }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          COMPARE: ${{ github.event_name == 'pull_request' && 'merge-base' || 'direct' }}
        run: |
          case "$EVENT" in
            push) set -- --lookup "$RUNNER_TEMP/push-lookup.json" ;;
            *) set -- --base "$BASE" --head "$HEAD" --compare "$COMPARE" ;;
          esac
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/repo-pycache" python3 "$RESOURCE_PATH/hygiene.py" changes "$@" --definition "actions/repository-hygiene/action.yml#step:resources" --definition "actions/repository-hygiene/action.yml#key:outputs.path.value" --definition "actions/repository-hygiene/action.yml#key:runs.using" --packages-definition ".github/workflows/pipeline.yml#step:coverage" --markdown-definition ".github/workflows/pipeline.yml#step:links" --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
      - name: Decide whether the PR author skips the convention checks
        id: author-decision
        if: github.event_name == 'pull_request'
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          node <<'EOF'
          const fs = require("node:fs");
          const author = process.env.PR_AUTHOR ?? "";
          const skip = author === "dependabot[bot]" || author === "renovate[bot]";
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `skip=${skip}\n`);
          for (const check of ["branch", "commits", "pull request title", "repository reference"]) {
            console.log(skip ? `Skipping ${check} check for bot PR author ${author}.` : `Running ${check} check for PR author ${author}.`);
          }
          EOF
      - name: Load the convention checks from this workflow revision
        id: conventions
        if: steps.author-decision.outputs.skip == 'false'
        uses: $/actions/publication-checks
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.author-decision.outputs.skip == 'false'
        with:
          node-version: ${{ steps.resources.outputs.node-version }}
          package-manager-cache: false
      - name: Check the pull request branch
        if: ${{ !cancelled() && steps.author-decision.outputs.skip == 'false' }}
        env:
          CONVENTIONS_PATH: ${{ steps.conventions.outputs.path }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: node "$CONVENTIONS_PATH/check-branch.cjs" "$HEAD_BRANCH"
      - name: Install the locked commitlint toolchain
        id: commitlint
        if: ${{ !cancelled() && steps.author-decision.outputs.skip == 'false' }}
        working-directory: ${{ runner.temp }}
        env:
          CONVENTIONS_PATH: ${{ steps.conventions.outputs.path }}
          npm_config_update_notifier: "false"
        run: |
          tool_directory="$RUNNER_TEMP/publication-checks-tools"
          mkdir -p "$tool_directory"
          cp "$CONVENTIONS_PATH/package.json" "$CONVENTIONS_PATH/package-lock.json" "$CONVENTIONS_PATH/commitlint.config.cjs" "$tool_directory/"
          npm ci --ignore-scripts --no-audit --no-fund --userconfig /dev/null --prefix "$tool_directory"
      - name: Check every pull request commit
        if: ${{ !cancelled() && steps.commitlint.outcome == 'success' }}
        env:
          CONVENTIONS_PATH: ${{ steps.conventions.outputs.path }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          COMMITLINT_CLI: ${{ runner.temp }}/publication-checks-tools/node_modules/@commitlint/cli/lib/cli.js
          COMMITLINT_CONFIG: ${{ runner.temp }}/publication-checks-tools/commitlint.config.cjs
        run: node "$CONVENTIONS_PATH/check-commits.cjs" "$BASE_SHA" "$HEAD_SHA"
      - name: Check the pull request title
        id: title
        if: ${{ !cancelled() && steps.commitlint.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMITLINT_CONTEXT: pull-request-title
          COMMITLINT_CLI: ${{ runner.temp }}/publication-checks-tools/node_modules/@commitlint/cli/lib/cli.js
          COMMITLINT_CONFIG: ${{ runner.temp }}/publication-checks-tools/commitlint.config.cjs
        run: |
          set -euo pipefail
          # The title as it is now, not as the event recorded it: a re-run after a corrected title checks the new one.
          title="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .title)"
          printf '%s\n' "$title" |
            node "$COMMITLINT_CLI" --config "$COMMITLINT_CONFIG" --cwd "$GITHUB_WORKSPACE" --verbose
      - name: Check the references to repositories of the owner
        if: ${{ !cancelled() && steps.author-decision.outputs.skip == 'false' }}
        env:
          CONVENTIONS_PATH: ${{ steps.conventions.outputs.path }}
          GITHUB_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node "$CONVENTIONS_PATH/check-references.cjs" "$BASE_SHA" "$HEAD_SHA"
      - name: Fixed callers and local workflows
        if: ${{ !cancelled() }}
        env:
          RESOURCE_PATH: ${{ steps.pipeline.outputs.path }}
          GITHUB_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: PYTHONPYCACHEPREFIX="$RUNNER_TEMP/repo-pycache" python3 "$RESOURCE_PATH/consumer_checks.py" callers --event "$EVENT" --author "$PR_AUTHOR" --summary "$GITHUB_STEP_SUMMARY"
      - name: Issues of the local workflow register
        if: ${{ !cancelled() }}
        env:
          RESOURCE_PATH: ${{ steps.pipeline.outputs.path }}
          GITHUB_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: PYTHONPYCACHEPREFIX="$RUNNER_TEMP/repo-pycache" python3 "$RESOURCE_PATH/consumer_checks.py" register --event "$EVENT" --author "$PR_AUTHOR" --summary "$GITHUB_STEP_SUMMARY"
      - name: Generated Dependabot configuration
        if: ${{ !cancelled() }}
        env:
          RESOURCE_PATH: ${{ steps.pipeline.outputs.path }}
          GITHUB_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: PYTHONPYCACHEPREFIX="$RUNNER_TEMP/repo-pycache" python3 "$RESOURCE_PATH/consumer_checks.py" dependabot --event "$EVENT" --author "$PR_AUTHOR" --summary "$GITHUB_STEP_SUMMARY"
      - name: Dependabot coverage of tracked package files
        id: coverage
        if: ${{ !cancelled() && steps.changes.outputs.packages == 'true' }}
        env:
          RESOURCE_PATH: ${{ steps.resources.outputs.path }}
        run: PYTHONPYCACHEPREFIX="$RUNNER_TEMP/repo-pycache" python3 "$RESOURCE_PATH/hygiene.py" coverage
      - name: Relative links in tracked Markdown
        id: links
        if: ${{ !cancelled() && steps.changes.outputs.markdown == 'true' }}
        env:
          RESOURCE_PATH: ${{ steps.resources.outputs.path }}
        run: PYTHONPYCACHEPREFIX="$RUNNER_TEMP/repo-pycache" python3 "$RESOURCE_PATH/hygiene.py" links --summary "$GITHUB_STEP_SUMMARY"
      - name: Install the pinned tools and verify their checksums
        id: install
        if: ${{ !cancelled() }}
        env:
          RESOURCE_PATH: ${{ steps.resources.outputs.path }}
          ACTIONLINT: ${{ steps.changes.outputs.actionlint }}
          ZIZMOR: ${{ steps.changes.outputs.zizmor }}
          REUSE: ${{ steps.changes.outputs.reuse }}
        run: |
          tools="--tool gitleaks"
          if [ "$ACTIONLINT" = "true" ]; then tools="$tools --tool actionlint --tool shellcheck"; fi
          if [ "$ZIZMOR" = "true" ]; then tools="$tools --tool zizmor"; fi
          if [ "$REUSE" = "true" ]; then tools="$tools --tool reuse"; fi
          # shellcheck disable=SC2086 # $tools holds separate --tool options
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/repo-pycache" python3 "$RESOURCE_PATH/install_tools.py" --pins "$RESOURCE_PATH/pins.json" --platform linux-x64 --destination "$RUNNER_TEMP/hygiene-tools" $tools
      - name: actionlint with the pinned ShellCheck
        id: actionlint
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.changes.outputs.actionlint == 'true' }}
        env:
          RESOURCE_PATH: ${{ steps.resources.outputs.path }}
          HYGIENE_TOOLS: ${{ runner.temp }}/hygiene-tools
        run: PYTHONPYCACHEPREFIX="$RUNNER_TEMP/repo-pycache" python3 "$RESOURCE_PATH/hygiene.py" actionlint --tools "$HYGIENE_TOOLS"
      - name: zizmor over workflows and action definitions
        id: zizmor
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.changes.outputs.zizmor == 'true' }}
        env:
          RESOURCE_PATH: ${{ steps.resources.outputs.path }}
          HYGIENE_TOOLS: ${{ runner.temp }}/hygiene-tools
        run: PYTHONPYCACHEPREFIX="$RUNNER_TEMP/repo-pycache" python3 "$RESOURCE_PATH/hygiene.py" zizmor --tools "$HYGIENE_TOOLS" --persona ""
      - name: REUSE licence assignments
        id: reuse
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.changes.outputs.reuse == 'true' }}
        env:
          RESOURCE_PATH: ${{ steps.resources.outputs.path }}
          HYGIENE_TOOLS: ${{ runner.temp }}/hygiene-tools
        run: PYTHONPYCACHEPREFIX="$RUNNER_TEMP/repo-pycache" python3 "$RESOURCE_PATH/hygiene.py" reuse --tools "$HYGIENE_TOOLS"
      - name: Gitleaks over all reachable history
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          RESOURCE_PATH: ${{ steps.resources.outputs.path }}
          HYGIENE_TOOLS: ${{ runner.temp }}/hygiene-tools
        run: |
          config=""
          baseline=""
          if [ -f .gitleaks.toml ]; then config=".gitleaks.toml"; fi
          if [ -f .gitleaks-baseline.json ]; then baseline=".gitleaks-baseline.json"; fi
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/repo-pycache" python3 "$RESOURCE_PATH/hygiene.py" gitleaks --tools "$HYGIENE_TOOLS" --config "$config" --baseline "$baseline"

  verdict:
    needs: [plan, custom, repository-hygiene]
    if: always()
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - name: Load the plan program from this workflow revision
        id: resources
        uses: $/actions/pipeline
      - name: Decide the verdict from the plan and the results of the parts
        env:
          RESOURCE_PATH: ${{ steps.resources.outputs.path }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$NEEDS" > "$RUNNER_TEMP/needs.json"
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/repo-pycache" python3 "$RESOURCE_PATH/plan.py" verdict --needs "$RUNNER_TEMP/needs.json" --summary "$GITHUB_STEP_SUMMARY"
