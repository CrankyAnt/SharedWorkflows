name: Python tests

on:
  pull_request:
  push:
    branches: [main]
  repository_dispatch:
    types: [dependabot-merged]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    permissions:
      actions: read
      contents: read
      pull-requests: read
    uses: $/.github/workflows/python-tests.yml
    with:
      python-version: "3.14"
      working-directory: tests/fixtures/python_tests
      install: dev
      runner-label: windows-2025
