version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: nuget
    directories:
      - /actions/recording/etw-consumer
      - /tests/fixtures/dotnet_test
      - /tests/fixtures/dotnet_console
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      per-dependency:
        group-by: dependency-name
        patterns: ["*"]
  - package-ecosystem: dotnet-sdk
    directory: /actions/recording/etw-consumer
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directories:
      - /actions/publication-checks
      - /tests/fixtures/node_test
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      per-dependency:
        group-by: dependency-name
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /tests/fixtures/python_tests
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
